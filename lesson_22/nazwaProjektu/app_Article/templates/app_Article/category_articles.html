<!DOCTYPE html>
<html>
<head><title>Kategoria: {{ category.name }}</title></head>
<body>
    <a href="/">Strona glowna</a>
    <h1>Artykuly w kategorii: {{ category.name }}</h1>

    {% if articles %}
        <ul>
            {% for article in articles %}
                <li>{{ article.title }} — {{ article.status }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Brak artykulow w tej kategorii.</p>
    {% endif %}
</body>
</html>
