{%extends "base.html"%}
{%load static%}

{%block extra_css%}
    <link rel="stylesheet" href="{% static 'blog/style.css' %}">
{%endblock%}

{%block content%}
    {%if posts%}
        {%for post in posts%}
            <h2>- {{post.title}}</h2>
        {%endfor%}
    {%else%}
        <h2>Nie ma postow w podanej kategori</h2>
    {%endif%}
{%endblock%}
