<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lesson 29{% endblock %}</title>
    <link rel="stylesheet" href="/static/task_center/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1><a href="{% url 'dashboard' %}">Centrum zadań Celery</a></h1>
            <p>Asynchroniczne zadania, harmonogramowanie i monitorowanie w Django.</p>
        </div>
    </header>

    <main class="container">
        {% if messages %}
            <section class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
