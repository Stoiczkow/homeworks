{% extends "base.html" %}
{% block content %}
<div class="content-section">
    {% if user.is_authenticated %}
    <h3>Hasło zostało pomyślnie zmienione</h3>
    <a href="{% url 'home' %}">Przejdz do strony głównej</a>
    {% else %}
    <h3>Jesteś niezalogowany </h3>
    <a href="{% url 'login' %}">Zaloguj</a>
    <a href="{% url 'register' %}">Zarejestruj</a>
    {% endif %}
</div>
{% endblock content %}
