{% extends "base.html" %}
{% load static %}

{% block title %}Wylogowano - Moja Strona{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
        <div class="card card-custom">
            <div class="card-body auth-card-body text-center">
                <i class="bi bi-check-circle-fill text-success auth-icon"></i>
                <h2 class="fw-bold mt-3">Zostałeś wylogowany</h2>
                <p class="text-muted mb-4">
                    Dziękujemy za odwiedziny! Do zobaczenia wkrótce.
                </p>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Zaloguj się ponownie
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-lg">
                        <i class="bi bi-person-plus"></i> Nowe konto
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
