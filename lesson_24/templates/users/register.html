{% extends 'base.html' %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<section class="card">
    <h1>Zarejestruj się</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary-btn" type="submit">Utwórz konto</button>
    </form>
    <p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a>.</p>
</section>
{% endblock %}
