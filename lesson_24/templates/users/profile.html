{% extends "base.html" %}
{% load static %}

{% block title %}Profil - {{ user.username }}{% endblock %}

{% block content %}
<section>
    <div>
        <h2>{{ user.username }}</h2>
        <p>
            <i></i> Zalogowany użytkownik
        </p>
    </div>
    <div>
        <a href="{% url 'home' %}">
            Strona główna
        </a>
        <a href="{% url 'password_change' %}">
            Zmień hasło
        </a>
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">
                Wyloguj się
            </button>
        </form>
    </div>
</section>
{% endblock content %}
