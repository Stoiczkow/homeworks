{% extends 'base.html' %}
{% block content %}
<h2>Skontaktuj się z nami</h2>
{{error}} <!--  Tutaj definiowany jest error -->
<form method="post">
    {% csrf_token %} <!-- Ważne zabezpieczenie przed atakami CSRF! -->
    {{ form.as_p }} <!-- Django wygeneruje pola formularza jako ,dodaje paragrafy kazdy kwadrat jest w nowej lini paragrafy <p> -->
    <button type="submit">Wyślij</button>
</form>
{% endblock %}
