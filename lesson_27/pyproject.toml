[project]
name = "lesson-27"
version = "0.1.0"
description = "Lesson 27 - Cache in Django REST Framework"
authors = [
    {name = "bgozlinski",email = "bartlomiej.gozlinski@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "django (>=6.0.4,<7.0.0)",
    "djangorestframework (>=3.15.0,<4.0.0)",
    "django-debug-toolbar (>=6.0.0,<7.0.0)",
    "django-redis (>=5.4.0,<6.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
