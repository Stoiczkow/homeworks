{% extends 'base.html' %}

{% block title %}Rejestracja{% endblock %}

{% block content %}
<section class="panel auth-panel">
    <h1>Załóż konto</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zarejestruj się</button>
    </form>
</section>
{% endblock %}
