{% extends 'base.html' %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<section class="panel auth-panel">
    <h1>Zaloguj się</h1>
    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Zaloguj</button>
    </form>
</section>
{% endblock %}
