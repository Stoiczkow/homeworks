{% extends 'base.html' %}

{% block title %}Lista Produktow{% endblock %}

{% block content %}

    {% for product in products %}

        <li>{{ product.price }}</li>
        <li>{{ product.category }}</li>
        <hr>
    {% endfor %}

{% endblock %}
