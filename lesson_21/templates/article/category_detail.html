{% load static %}

<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>{{ category.name }}</h1>

    <h2>Artykuły</h2>
    <ul>
        {% for article in articles %}
            <li>{{ article.title }}</li>
        {% empty %}
            <li>Brak artykułów w tej kategorii.</li>
        {% endfor %}
    </ul>
</body>
</html>
