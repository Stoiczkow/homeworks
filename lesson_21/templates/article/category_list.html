{% load static %}

<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kategorie</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Kategorie</h1>

    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category_detail' category.id %}">{{ category.name }}</a>
            </li>
        {% empty %}
            <li>Brak kategorii.</li>
        {% endfor %}
    </ul>
</body>
</html>
