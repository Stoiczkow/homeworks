{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Zadanie 6 – nazwa kategorii w h1 -->
    <h1>{{ category.name }}</h1>

    <!-- Zadanie 7 – lista artykułów należących do kategorii -->
    <h2>Artykuły w tej kategorii:</h2>
    <ul>
        {% for article in category.article_set.all %}
            <li>{{ article.title }}</li>
        {% empty %}
            <li>Brak artykułów w tej kategorii.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'category-list' %}">Powrót do listy kategorii</a>
</body>
</html>
