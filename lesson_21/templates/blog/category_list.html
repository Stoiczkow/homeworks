{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Lista kategorii</title>
    <!-- Zadanie 4 – plik statyczny CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Kategorie</h1>
    <!-- Zadanie 3 – lista nieuporządkowana -->
    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category-detail' category.pk %}">{{ category.name }}</a>
            </li>
        {% empty %}
            <li>Brak kategorii.</li>
        {% endfor %}
    </ul>
    <hr>
    <a href="{% url 'article-list' %}">Przejdź do artykułów</a>
</body>
</html>
