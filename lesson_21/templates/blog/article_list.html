{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Artykuły</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <h1>Artykuły</h1>

    <!-- Zadanie 10 – formularz wyszukiwania -->
    <form method="get" action="">
        <input type="text" name="q" value="{{ q }}" placeholder="Szukaj artykułu...">
        <button type="submit">Szukaj</button>
    </form>

    <ul>
        {% for article in articles %}
            <li>
                {{ article.title }}
                <!-- Zadanie 8 – napis NOWOŚĆ! dla artykułów z ostatnich 3 dni -->
                {% if article.is_new %}
                    <span style="color: red; font-weight: bold;">NOWOŚĆ!</span>
                {% endif %}
            </li>
        {% empty %}
            <li>Brak artykułów.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'category-list' %}">Przejdź do kategorii</a>
</body>
</html>
